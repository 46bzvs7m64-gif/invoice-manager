<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231f2937'/%3E%3Crect x='3.5' y='3' width='9' height='10' fill='none' stroke='%23fff'/%3E%3C/svg%3E">
<title>发票管家 · 会务票据管理</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.6/dist/index.css">
<script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.7.6/dist/index.full.min.js"></script>
<script src="https://unpkg.com/element-plus@2.7.6/dist/locale/zh-cn.min.js"></script>
<style>
  :root{
    --navy:#0b1f3a; --navy2:#102a4c; --line:#e6ebf2; --ink:#1e293b; --sub:#64748b;
    --brand:#2563eb; --red:#dc2626; --green:#16a34a; --amber:#d97706;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#f1f5f9;color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei","微软雅黑",sans-serif;font-size:13px}
  .app{display:flex;min-height:100vh}
  /* ===== 深色侧栏（与真实系统一致） ===== */
  .sidebar{width:214px;flex:none;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);
    color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sb-logo{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .sb-logo .lg{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#38bdf8,#2563eb);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .sb-logo b{color:#fff;font-size:15.5px;display:block;letter-spacing:.5px}
  .sb-logo span{font-size:10px;color:#7d93b3;display:block;margin-top:1px}
  .sb-nav{padding:12px 10px;flex:1}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;
    font-size:13px;color:#aebfd6;margin-bottom:3px;transition:all .15s;user-select:none;position:relative}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
  .nav-item.on{background:linear-gradient(90deg,rgba(56,189,248,.22),rgba(56,189,248,.06));color:#fff;font-weight:600}
  .nav-item.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:#38bdf8}
  .nav-item .ico{width:17px;text-align:center;font-size:14px}
  .nav-item .el-badge{margin-left:auto}
  .sb-foot{padding:12px 16px;font-size:10px;color:#64748b;border-top:1px solid rgba(255,255,255,.08);line-height:1.7}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:13px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar h1{font-size:16px;margin:0;font-weight:700}
  .topbar .ctx{font-size:11.5px;color:var(--sub)}
  .topbar .sp{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .content{padding:18px 24px 30px;max-width:1280px;width:100%}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;
    box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .card h3{font-size:14px;margin:0 0 4px;font-weight:700;display:flex;align-items:center;gap:9px}
  .card h3 .sub{font-size:11px;color:var(--sub);font-weight:400}
  .card h3 .right{margin-left:auto;font-size:11px;color:var(--sub);font-weight:400}
  .money{color:var(--red);font-weight:700;font-variant-numeric:tabular-nums}
  /* 效率收益带 */
  .roi-band{background:linear-gradient(120deg,#0b1f3a,#173f6e);border-radius:12px;padding:15px 20px;margin-bottom:14px;
    display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:14px;align-items:center;color:#e2e8f0}
  .roi-band .rb-title{font-size:14px;font-weight:700;color:#fff}
  .roi-band .rb-title span{display:block;font-size:10.5px;color:#9db4d4;font-weight:400;margin-top:3px;line-height:1.5}
  .roi-m{border-left:1px solid rgba(255,255,255,.14);padding-left:14px}
  .roi-m b{font-size:19px;color:#7dd3fc;display:block;font-variant-numeric:tabular-nums}
  .roi-m span{font-size:10.5px;color:#9db4d4;line-height:1.5;display:block;margin-top:2px}
  /* KPI */
  .kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:13px 15px;position:relative;overflow:hidden;background:#fff}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
  .kpi.k-red::before{background:var(--red)} .kpi.k-green::before{background:var(--green)}
  .kpi.k-amber::before{background:var(--amber)} .kpi.k-cyan::before{background:#0284c7}
  .kpi .kl{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:5px}
  .kpi .kv{font-size:23px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.15}
  .kpi .kv small{font-size:11px;font-weight:400;color:var(--sub);margin-left:3px}
  .kpi .ks{font-size:10.5px;color:#94a3b8;margin-top:4px;line-height:1.5}
  .kpi .kbar{height:5px;border-radius:3px;background:#eef2f7;margin-top:7px;overflow:hidden}
  .kpi .kbar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#2563eb);border-radius:3px}
  .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
  .grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  /* 预警 */
  .alert-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:12px}
  .alert{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s;background:#fff}
  .alert:hover{box-shadow:0 3px 12px rgba(15,23,42,.09);transform:translateY(-1px)}
  .alert .at{font-size:11.5px;color:var(--sub);display:flex;justify-content:space-between}
  .alert .av{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .alert.a-ok{opacity:.75;cursor:default} .alert.a-ok:hover{box-shadow:none;transform:none}
  /* 横条 */
  .hs-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px}
  .hs-name{width:132px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .hs-track{flex:1;height:11px;background:#eef2f7;border-radius:6px;overflow:hidden}
  .hs-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,#60a5fa,#2563eb)}
  .hs-amt{width:118px;flex:none;text-align:right;color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums}
  /* 表格 */
  .el-table .fapiao-no{font-family:Consolas,monospace;font-size:11.5px;color:#475569}
  .row-flag{background:#fef3c7 !important}
  .row-future{background:#fee2e2 !important}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .filter-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:14px}
  .matched{font-size:12.5px;color:var(--sub)}
  .matched b{color:var(--ink)}
  .tag-special{color:#b45309 !important;background:#fef3c7 !important;border-color:#fcd34d !important}
  /* 采集/识别日志 */
  .logbox{background:#0b1220;color:#d7e3f4;border-radius:9px;padding:13px 15px;font-size:12px;line-height:1.85;
    height:250px;overflow-y:auto;font-family:Consolas,"Courier New",monospace;white-space:pre-wrap;margin-top:8px}
  .logbox .ok{color:#34d399}.logbox .warn{color:#fbbf24}.logbox .info{color:#38bdf8}.logbox .dim{color:#64748b}
  .step-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:14px}
  .step{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#f8fafc}
  .step .sn{width:22px;height:22px;border-radius:50%;background:#2563eb;color:#fff;font-size:11.5px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;margin-bottom:7px}
  .step b{font-size:12.5px;display:block}.step span{font-size:11px;color:var(--sub);line-height:1.55;display:block;margin-top:3px}
  .demo-note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;padding:10px 15px;font-size:12px;
    color:#1e40af;line-height:1.7;margin-bottom:14px}
  .demo-note b{color:#1d4ed8}
  .demo-note code{background:#dbeafe;padding:1px 6px;border-radius:4px;font-size:11.5px}
  .group-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;font-size:13.5px;font-weight:600}
  .g-amt{color:var(--red);font-variant-numeric:tabular-nums}
  .drawer-kv{display:grid;grid-template-columns:96px 1fr;gap:9px 12px;font-size:12.5px;line-height:1.5}
  .drawer-kv .k{color:var(--sub)} .drawer-kv .v{color:var(--ink);word-break:break-all}
  @media(max-width:900px){
    .app{display:block}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto}
    .sb-logo{border-bottom:none;border-right:1px solid rgba(255,255,255,.08);flex:none}
    .sb-nav{display:flex;gap:4px;padding:8px;flex:none}
    .nav-item{margin-bottom:0;white-space:nowrap}.nav-item.on::before{display:none}
    .sb-foot{display:none}
    .roi-band{grid-template-columns:1fr 1fr}
    .kpi-grid{grid-template-columns:1fr 1fr}.alert-grid{grid-template-columns:1fr 1fr}
    .grid2,.grid2b{grid-template-columns:1fr}.step-grid{grid-template-columns:1fr 1fr}
    .content{padding:14px 12px}
    .topbar .sp{margin-left:0;width:100%}
    .topbar{padding:12px 14px}
  }

  /* ==================== v2：空库形态 + 朴素后台观感 ==================== */
  :root{
    --navy:#1f2937; --navy2:#26303b; --line:#e3e6ea; --ink:#1f2933; --sub:#6b7280;
    --brand:#2563eb; --red:#b42318; --green:#16794a; --amber:#a15c00;
  }
  body{background:#f2f3f5}
  .sidebar{background:#1f2937!important;background-image:none!important}
  .sb-logo{border-bottom:1px solid rgba(255,255,255,.08)!important;padding:16px!important}
  .sb-logo b{font-size:15px!important;letter-spacing:0!important}
  .sb-logo span{font-size:10.5px!important;opacity:.55!important}
  .sb-nav{padding:8px 0!important}
  .nav-item{border-radius:3px!important;margin:1px 8px!important;padding:8px 10px!important;font-size:12.5px!important}
  .nav-item.on{background:rgba(255,255,255,.10)!important;box-shadow:none!important;color:#fff!important}
  .sb-foot{font-size:10.5px!important;opacity:.5!important;padding:10px 16px 14px!important;line-height:1.6!important}
  .topbar{background:#fff!important;border-bottom:1px solid var(--line)!important;box-shadow:none!important}
  .page-title{font-size:16px!important;letter-spacing:0!important}
  .page-sub{font-size:11.5px!important;color:var(--sub)!important}
  .content{padding:14px 16px 28px!important}
  .card{border-radius:5px!important;box-shadow:none!important;border:1px solid var(--line)!important}
  .card h3{font-size:13.5px!important;font-weight:600!important}
  .kpi{border-radius:5px!important;box-shadow:none!important;border:1px solid var(--line)!important;background:#fff!important}
  .kpi.k-red,.kpi.k-green,.kpi.k-cyan,.kpi.k-amber{background:#fff!important;border-color:var(--line)!important}
  .kpi .kl{font-size:11.5px!important;color:var(--sub)!important}
  .kpi .kv{font-size:19px!important;letter-spacing:0!important}
  .kpi .ks{font-size:10.5px!important;color:var(--sub)!important}
  .roi-band{background:#fbfbf8!important;border:1px solid #e6e3da!important;border-radius:5px!important;
    box-shadow:none!important;padding:12px 14px!important}
  .roi-band .rb-title{font-size:12px!important}
  .roi-m b{color:var(--ink)!important;font-size:15px!important}
  .hs-bar{background:var(--brand)!important;background-image:none!important;border-radius:2px!important}
  .hbar-fill{background:var(--brand)!important;background-image:none!important;border-radius:2px!important}
  .hbar-fill.amber{background:var(--amber)!important;background-image:none!important}
  .demo-note{background:#f8fafc!important;border:1px solid var(--line)!important;border-left:3px solid #94a3b8!important;
    border-radius:4px!important;color:#475569!important;font-size:12px!important;line-height:1.7!important}
  .demo-note a{color:var(--brand)!important}
  .empty-hint{padding:30px 8px;text-align:center;color:var(--sub);font-size:12.5px;
    background:#fafbfc;border:1px dashed #dfe3e8;border-radius:4px;margin-top:10px}
  .empty-hint b{color:var(--ink)}
  .el-button{border-radius:3px!important}
  .el-tag{border-radius:3px!important}
  .el-card,.el-drawer{border-radius:0!important}
  .logbox{background:#f7f8fa!important;color:#374151!important;border:1px solid var(--line)!important;
    border-radius:4px!important;font-size:11.5px!important}
  .step{border-radius:4px!important;box-shadow:none!important;border:1px solid var(--line)!important;background:#fff!important}
  .alert{border-radius:4px!important;box-shadow:none!important;background:#fff!important}
  .alert.a-ok{background:#fafbfc!important}
  .filter-box{background:#fff!important;border:1px solid var(--line)!important;border-radius:5px!important}
  .stat-item{border-radius:4px!important;background:#fafbfc!important}

  .kpi::before{display:none!important}
  .empty-hint{border-style:solid!important;border-color:var(--line)!important;background:#fafbfc!important}
  .logbox{border:1px solid var(--line)!important}

  .logbox{height:auto!important;min-height:108px;max-height:240px}
  .step{border-radius:4px!important;box-shadow:none!important;background:#fff!important}
  .step .sn{width:auto!important;height:auto!important;border-radius:0!important;background:none!important;
    color:var(--sub)!important;font-size:10.5px!important;font-weight:600!important;margin-right:4px}
  .step b{font-size:12.5px!important}
  .step span{font-size:11px!important;color:var(--sub)!important;line-height:1.55!important}
</style>
</head>
<body>
<div id="app">
<div class="app">
  <!-- ============ 侧边导航 ============ -->
  <aside class="sidebar">
    <div class="sb-logo">
      
      <div><b>发票管家</b><span>会务票据全生命周期管理</span></div>
    </div>
    <nav class="sb-nav">
      <div class="nav-item" :class="{on:tab==='dash'}" @click="tab='dash'">经营仪表盘</div>
      <div class="nav-item" :class="{on:tab==='list'}" @click="tab='list'">
        发票管理
        <el-badge :value="unusedN" :hidden="!unusedN" type="danger" style="margin-left:auto"></el-badge>
      </div>
      <div class="nav-item" :class="{on:tab==='groups'}" @click="tab='groups'">归类视图</div>
      <div class="nav-item" :class="{on:tab==='sync'}" @click="tab='sync'">发票采集</div>
      <div class="nav-item" :class="{on:tab==='ocr'}" @click="tab='ocr'">
        智能识别
        <el-badge :value="pendingN" :hidden="!pendingN" type="warning" style="margin-left:auto"></el-badge>
      </div>
    </nav>
    <div class="sb-foot">私有化部署 · 数据本机存储<br>FastAPI + Vue3 · 前端为纯静态壳</div>
  </aside>

  <!-- ============ 主区域 ============ -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1>{{ pageTitle[tab] }}</h1>
        <div class="ctx">{{ ctxText }}</div>
      </div>
      <div class="sp">
        <el-tag type="info" effect="plain">第十四届全国中外合作办学年会 · 专项票据</el-tag>
        <el-tag type="info" effect="plain">空库</el-tag>
      </div>
    </div>

    <div class="content">
      <div class="demo-note">
        <b>空库状态：</b>未预置任何发票数据，台账、图表、预警都从「暂无数据」开始；接入采集或手动导入后才会有记录。
        完整后端见 <a href="https://github.com/46bzvs7m64-gif/invoice-manager" target="_blank">源码仓库</a>。
      </div>

      <!-- ========== 经营仪表盘 ========== -->
      <template v-if="tab==='dash'">
        <!-- 效率收益 -->
        <div class="roi-band" v-if="invoices.length">
          <div class="rb-title">效率收益（系统上线前后测算）
            <span>口径：单张发票「下载附件 → 登记台账 → 核对查重」人工约 3 分钟；系统自动采集识别后仅需人工抽检复核约 20 秒</span>
          </div>
          <div class="roi-m"><b>{{ roi.manualMD }}</b><span>人工建账约需 {{ roi.manualMin }} 分钟 ≈ {{ roi.manualMD }} 人日</span></div>
          <div class="roi-m"><b>{{ roi.sysMin }} 分钟</b><span>系统处理 + 人工复核 ≈ {{ roi.sysMin }} 分钟</span></div>
          <div class="roi-m"><b>↓ {{ roi.savePct }}%</b><span>事务性工时压缩，释放给供应商对账</span></div>
          <div class="roi-m"><b>5 天 → 1 天</b><span>月结报销出表周期，支撑会后快速核销</span></div>
        </div>

        <div class="kpi-grid">
          <div class="kpi"><div class="kl">发票总数 / 价税合计</div>
            <div class="kv">{{ invoices.length }} <small>张</small>　<span class="money">¥{{ fmt(d.total) }}</span></div>
            <div class="ks">不含税净额 ¥{{ fmt(d.net) }} · 覆盖供应商 {{ sellerN }} 家</div></div>
          <div class="kpi k-red"><div class="kl">待报销（未核销）</div>
            <div class="kv" style="color:var(--red)">{{ unusedN }} <small>张</small>　¥{{ fmt(d.unused) }}</div>
            <div class="ks">会后第二批改款，建议本周完成核销</div></div>
          <div class="kpi k-green"><div class="kl">报销进度（已用金额口径）</div>
            <div class="kv" style="color:var(--green)">{{ usedRatio }}%</div>
            <div class="kbar"><i :style="{width:usedRatio+'%'}"></i></div>
            <div class="ks">已报销 ¥{{ fmt(d.used) }} / 合计 ¥{{ fmt(d.total) }}</div></div>
          <div class="kpi k-cyan"><div class="kl">进项税额合计</div>
            <div class="kv">¥{{ fmt(d.tax) }}</div>
            <div class="ks">其中<b style="color:#b45309"> 专票可抵扣 ¥{{ fmt(d.deductible) }}</b>（普票不可抵扣）</div></div>
          <div class="kpi k-amber" @click="jumpAnomaly('all')" style="cursor:pointer">
            <div class="kl">合规预警 ⓘ</div>
            <div class="kv" :style="{color:anomalyTotal?'var(--red)':'var(--green)'}">{{ anomalyTotal }} <small>项</small></div>
            <div class="ks">重复票号 / 大额 / 异常日期 / 专票缺税额，点击下钻</div></div>
          <div class="kpi"><div class="kl">识别任务</div>
            <div class="kv">{{ pendingN }} <small>张待处理</small></div>
            <div class="ks">已识别 {{ doneN }} 张 · 识别成功率 {{ ocrRate }}%</div></div>
        </div>

        <div class="grid2" style="margin-top:14px">
          <div class="card">
            <h3>近 6 个月发票金额趋势<span class="sub">按开票日期 · 堆叠：已报销 / 待报销（元）</span></h3>
            <div class="empty-hint" v-if="!invoices.length">暂无数据：导入发票后自动生成</div>
            <svg v-else viewBox="0 0 560 230" style="width:100%;height:auto;margin-top:8px">
              <g v-for="(g,i) in yGrid" :key="'g'+i">
                <line x1="44" :y1="22+150*(1-i/4)" x2="540" :y2="22+150*(1-i/4)" stroke="#eef2f7"/>
                <text x="38" :y="22+150*(1-i/4)+3" fill="#94a3b8" font-size="9" text-anchor="end">{{ fmtAxis(g*maxM/4) }}</text>
              </g>
              <g v-for="(m,i) in monthly">
                <rect :x="56+i*82" :y="22+150*(1-(m.used+m.unused)/maxM)" :width="26" :height="150*(m.used+m.unused)/maxM" rx="3" fill="#2563eb"/>
                <rect :x="56+i*82" :y="22+150*(1-(m.used+m.unused)/maxM)+150*(m.used+m.unused)/maxM-150*m.unused/maxM"
                      :width="26" :height="150*m.unused/maxM" rx="0" fill="#fbbf24" opacity=".85"/>

            <div class="step"><span class="sn">4</span><b>入库查重</b><span>发票号跨记录查重、MD5 拦截重复文件，异常票保留原因待人工复核</span></div>

<!-- 发票详情抽屉 -->
<el-drawer v-model="drawer" size="380px" title="发票详情">

      <span class="k">价税合计</span><span class="v money">¥{{ fmt(cur.total) }}</span>

<script>
const { createApp, reactive, ref, computed } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

/* =============== 数据源 ===============
   这里不再内置任何演示发票。真实部署时由后端 /api/invoices 提供，
   未接入后端即为空库，所有页面走空状态。
   ======================================= */
const invoices = [];
const BUYER = { name: "", tax: "" };
/* 工具函数（原生成器遗留，界面与导出仍在用） */
function r2(x){ return Math.round(x*100)/100; }
function pad(n){ return String(n).padStart(2,"0"); }
let _seed=1;
function rnd(){ _seed=(_seed*9301+49297)%233280; return _seed/233280; }

/* =============== 应用 =============== */
createApp({
  setup(){
    const tab=ref("dash");
    const flt=reactive({seller:"",category:"",type:"",status:"unused",keyword:"",anomaly:"all"});
    const grpDim=ref("seller"); const grpActive=ref([]);
    const drawer=ref(false); const cur=ref(null);
    const markOnExport=ref(false); const selected=ref([]);
    const syncDays=ref(90), syncRun=ref(false), syncStart=ref(false), syncLog=ref("");
    const syncStat=reactive({scan:0,hit:0,dl:0,skip:0});
    const ocrRun=ref(false), ocrStart=ref(false), ocrLog=ref("");
    const ocrStat=reactive({total:0,ok:0,fail:0,cur:0});

    const sellers=[...new Set(invoices.map(x=>x.seller))].sort();
    const categories=[...new Set(invoices.map(x=>x.category))].sort();

    /* ----- 合规规则引擎（与真实后端同口径） ----- */
    const anomalies=computed(()=>{
      const noMap={}; invoices.forEach(x=>{ if(/^\d/.test(x.no)) (noMap[x.no]=noMap[x.no]||[]).push(x); });
      return {
        duplicates:Object.values(noMap).filter(a=>a.length>1).flat(),
        big:invoices.filter(x=>x.total>=10000),
        future:invoices.filter(x=>x.date>"2026-10-11"),
        missingtax:invoices.filter(x=>x.special && x.tax==null),
      };
    });
    const anomalyLabel={all:"全部异常",duplicates:"重复发票号码",big:"大额发票（≥1万）",future:"开票日期异常",missingtax:"专票缺税额"};
    const alertCards=computed(()=>[
      {key:"duplicates",label:"重复发票号码",list:anomalies.value.duplicates,color:"#dc2626",
       desc:"同一票号出现 2 次，疑似重复报销 / 重复入账"},
      {key:"big",label:"大额发票 ≥1万",list:anomalies.value.big,color:"#d97706",
       desc:"大额支出需重点复核合同与付款记录"},
      {key:"future",label:"开票日期异常",list:anomalies.value.future,color:"#dc2626",
       desc:"开票日期晚于系统日期，录入错误或预录风险"},
      {key:"missingtax",label:"专票缺失税额",list:anomalies.value.missingtax,color:"#d97706",
       desc:"专用发票无税额无法进项抵扣，需退回重开"},
    ]);
    const anomalyTotal=computed(()=>alertCards.value.reduce((a,x)=>a+(x.list.length?1:0),0));

    /* ----- 列表筛选 ----- */
    const filtered=computed(()=>invoices.filter(x=>{
      if(flt.seller && x.seller!==flt.seller) return false;
      if(flt.category && x.category!==flt.category) return false;
      if(flt.type==="special" && !x.special) return false;
      if(flt.type==="normal" && x.special) return false;
      if(flt.status!=="all" && x.status!==flt.status) return false;
      if(flt.keyword && !(x.no.includes(flt.keyword)||x.seller.includes(flt.keyword)||x.file.includes(flt.keyword))) return false;
      if(flt.anomaly!=="all"){
        const set=new Set(anomalies.value[flt.anomaly].map(y=>y.id));
        if(!set.has(x.id)) return false;
      }
      return true;
    }));
    const sum=(arr,f)=>arr.reduce((a,x)=>a+(f(x)||0),0);
    const matchedAmount=computed(()=>r2(sum(filtered.value,x=>x.total)));
    const matchedTax=computed(()=>r2(sum(filtered.value,x=>x.tax)));
    const matchedDeductible=computed(()=>r2(sum(filtered.value,x=>x.special&&x.tax!=null?x.tax:0)));

    /* ----- 仪表盘聚合 ----- */
    const d=computed(()=>({
      total:r2(sum(invoices,x=>x.total)), net:r2(sum(invoices,x=>x.net)),
      tax:r2(sum(invoices,x=>x.tax)),
      deductible:r2(sum(invoices,x=>x.special&&x.tax!=null?x.tax:0)),
      unused:r2(sum(invoices,x=>x.status==="unused"?x.total:0)),
      used:r2(sum(invoices,x=>x.status==="used"?x.total:0)),
    }));
    const unusedN=computed(()=>invoices.filter(x=>x.status==="unused").length);
    const sellerN=computed(()=>new Set(invoices.map(x=>x.seller)).size);
    const usedRatio=computed(()=>d.value.total?Math.round(d.value.used/d.value.total*100):0);
    const specialN=computed(()=>invoices.filter(x=>x.special).length);
    const pendingN=computed(()=>invoices.filter(x=>x.ocr!=="success").length);
    const doneN=computed(()=>invoices.filter(x=>x.ocr==="success").length);
    const ocrRate=computed(()=>invoices.length?Math.round(doneN.value/invoices.length*100):0);
    const roi=computed(()=>{
      const manualMin=invoices.length*3, sysMin=Math.round(invoices.length*20/60);
      const savePct=manualMin?Math.round((1-sysMin/manualMin)*100):0;
      return {manualMin, manualMD:r2(manualMin/60/8), sysMin, savePct};
    });
    const monthly=computed(()=>{
      const out=[];
      for(let i=5;i>=0;i--){
        const dt=new Date(2026,9-i,1), key=`2026-${pad(dt.getMonth()+1)}`;
        const rows=invoices.filter(x=>x.date.startsWith(key));
        out.push({month:key, used:r2(sum(rows,x=>x.status==="used"?x.total:0)), unused:r2(sum(rows,x=>x.status!=="used"?x.total:0))});
      }
      return out;
    });
    const maxM=computed(()=>Math.max(...monthly.value.map(m=>m.used+m.unused)));
    const yGrid=[0,1,2,3,4];
    const catBars=computed(()=>{
      const m={}; invoices.forEach(x=>{(m[x.category]=m[x.category]||{name:x.category,amount:0,count:0});m[x.category].amount+=x.total;m[x.category].count++;});
      return Object.values(m).map(x=>({...x,amount:r2(x.amount)})).sort((a,b)=>b.amount-a.amount);
    });
    const catMax=computed(()=>Math.max(...catBars.value.map(x=>x.amount)));
    const topSellers=computed(()=>{
      const m={}; invoices.forEach(x=>{(m[x.seller]=m[x.seller]||{name:x.seller,amount:0,count:0});m[x.seller].amount+=x.total;m[x.seller].count++;});
      return Object.values(m).map(x=>({...x,amount:r2(x.amount)})).sort((a,b)=>b.amount-a.amount).slice(0,5);
    });
    const sMax=computed(()=>Math.max(...topSellers.value.map(x=>x.amount)));
    const pct1=v=>(v*100).toFixed(0)+"%";
    const fmt=n=>Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
    const fmtAxis=n=>n>=10000?(n/10000).toFixed(1)+"万":Math.round(n);

    /* ----- 归类 ----- */
    const groups=computed(()=>{
      const key=grpDim.value==="seller"?"seller":"category";
      const m={};
      invoices.forEach(x=>{(m[x[key]]=m[x[key]]||{name:x[key],count:0,used:0,amount:0,dmin:x.date,dmax:x.date,items:[]});
        const g=m[x[key]]; g.count++; if(x.status==="used")g.used++; g.amount+=x.total;
        if(x.date<g.dmin)g.dmin=x.date; if(x.date>g.dmax)g.dmax=x.date; g.items.push(x);});
      return Object.values(m).map(g=>({...g,amount:r2(g.amount)})).sort((a,b)=>b.amount-a.amount);
    });

    /* ----- 行标记 / 详情 ----- */
    const rowFlags=x=>{
      const f=[];
      if(anomalies.value.duplicates.some(y=>y.id===x.id)) f.push({k:"duplicates",t:"重复票号",c:"danger",desc:"该发票号码在台账中出现 2 次，报销前须核实是否同一张票重复提交。"});
      if(x.total>=10000) f.push({k:"big",t:"大额",c:"warning",desc:"单张价税合计 ≥ 10,000 元，需核对合同、验收单与付款记录。"});
      if(x.date>"2026-10-11") f.push({k:"future",t:"日期异常",c:"danger",desc:"开票日期晚于系统日期，请核对是否录入错误。"});
      if(x.special && x.tax==null) f.push({k:"missingtax",t:"专票缺税",c:"warning",desc:"专用发票税额缺失，将无法进行进项抵扣，应退回销售方重开。"});
      return f;
    };
    const rowClass=({row})=>{
      const f=rowFlags(row);
      if(f.some(x=>x.k==="future")) return "row-future";
      if(f.length) return "row-flag";
      return "";
    };
    const openDetail=x=>{ cur.value=x; drawer.value=true; };
    const mark=x=>{ x.status="used"; x.batch="会后核销批（10.11）"; ElMessage.success("已核销："+x.seller); };
    const unmark=x=>{ x.status="unused"; x.batch=""; ElMessage.success("已撤销核销"); };
    const onSelect=rows=>selected.value=rows;
    const batchUse=()=>{
      if(!selected.value.length){ ElMessage.warning("请先勾选待报销发票"); return; }
      selected.value.forEach(x=>{x.status="used";x.batch="会后核销批（10.11）";});
      ElMessage.success("已批量核销 "+selected.value.length+" 张");
    };
    const jumpAnomaly=k=>{ flt.anomaly=k; flt.status="all"; tab.value="list"; };

    /* ----- 导出 CSV（Excel 可直接打开，BOM 防中文乱码） ----- */
    const exportCsv=(autoMark)=>{
      const rows=filtered.value;
      if(!rows.length){ ElMessage.warning("当前筛选无发票"); return; }
      const head=["开票日期","发票类型","发票号码","销售方","销售方税号","购买方","不含税金额","税额","价税合计","类目","状态","备注"];
      const esc=v=>{ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
      const lines=[head.join(",")].concat(rows.map(x=>[
        x.date,x.special?"专用发票":"普通发票",x.no,x.seller,x.sellerTax,x.buyer,x.net,x.tax==null?"":x.tax,x.total,x.category,
        x.status==="used"?"已使用":"未使用",x.batch||""].map(esc).join(",")));
      lines.push(["合计","","","","","",r2(sum(rows,x=>x.net)),r2(sum(rows,x=>x.tax)),r2(sum(rows,x=>x.total)),"","",""].join(","));
      const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download="年会报销单_2026-10_"+rows.length+"张.csv"; a.click();
      URL.revokeObjectURL(a.href);
      if(markOnExport.value || autoMark){ rows.forEach(x=>{if(x.status!=="used"){x.status="used";x.batch="报销单导出批（10.11）";}});
        ElMessage.success("已导出并标记 "+rows.length+" 张，报销闭环完成"); }
      else ElMessage.success("已导出 "+rows.length+" 张发票");
    };

    /* ----- 采集演示 ----- */
    const log=(box,html)=>{ box.value+=html+"\n"; };
    function runSync(){
      syncStart.value = true; syncRun.value = false;
      Object.assign(syncStat, {scan:0, hit:0, dl:0, skip:0});
      syncLog.value = "";
      const L = syncLog;
      log(L, '<span class="info">[INFO]</span> 当前为静态部署，未配置 IMAP 邮箱凭据，采集通道未连接。');
      log(L, '<span class="warn">[SKIP]</span> 未执行采集，也没有写入任何数据。');
      log(L, '<span class="dim">  接好后端（FastAPI + imaplib）后，这里会按这个顺序输出：</span>');
      log(L, '<span class="dim">  连接 SSL → SEARCH SINCE 日期粗筛 → 主题/发件人匹配 → 附件魔数校验 → MD5 去重 → 入库</span>');
      ElMessage.warning("未连接邮箱服务，未采集到任何数据");
    }

    /* ----- 识别演示 ----- */
    function runOcr(){
      ocrStart.value = true; ocrRun.value = false;
      Object.assign(ocrStat, {total:0, ok:0, fail:0, cur:0});
      ocrLog.value = "";
      const L = ocrLog;
      if (!pendingN.value) {
        log(L, '<span class="dim">  库里没有待识别发票（0 张），无需识别。</span>');
        ElMessage.info("没有待识别的发票");
        return;
      }
      log(L, '<span class="info">[INFO]</span> 当前为静态部署，未配置模型服务（DASHSCOPE_API_KEY），识别通道未连接。');
      log(L, '<span class="warn">[SKIP]</span> 待识别 ' + pendingN.value + ' 张，本次未调用模型，发票状态未变更。');
      log(L, '<span class="dim">  接好后端后：PDF → Base64 → 多模态抽取 → 归一化 → 查重入库。</span>');
      ElMessage.warning("未配置模型服务，未执行识别");
    }

    const pageTitle={dash:"经营仪表盘",list:"发票管理",groups:"归类视图",sync:"发票采集",ocr:"智能识别"};
    const ctxText=computed(()=>({
      dash:"票据台账 · 合规预警 · 报销进度",
      list:"多条件检索 · 核销 · 导出报销单",
      groups:"按供应商/类目聚合，支撑集中对账",
      sync:"IMAP 增量采集 · 三层漏斗 · MD5 去重",
      ocr:"多模态大模型结构化抽取 · 异常兜底",
    })[tab.value]);

    return {tab,flt,grpDim,grpActive,drawer,cur,markOnExport,syncDays,syncRun,syncStart,syncLog,syncStat,
      ocrRun,ocrStart,ocrLog,ocrStat,sellers,categories,invoices,filtered,matchedAmount,matchedTax,matchedDeductible,
      d,unusedN,sellerN,usedRatio,specialN,pendingN,doneN,ocrRate,roi,monthly,maxM,yGrid,catBars,catMax,topSellers,sMax,
      groups,anomalies,anomalyLabel,alertCards,anomalyTotal,
      fmt,fmtAxis,pct1,rowFlags,rowClass,openDetail,mark,unmark,onSelect,batchUse,jumpAnomaly,exportCsv,
      runSync,runOcr,pageTitle,ctxText};
  }
}).use(ElementPlus,{locale:ElementPlusLocaleZhCn}).mount("#app");
</script>
</body>
</html>
